name: Aegis CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Suite & Architecture Validations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v --durations=10

      - name: Validate Fast Dense Embeddings & Vector Search
        run: |
          python -c "from aegis.rag.retriever import get_rag_knowledge_base; kb = get_rag_knowledge_base(); res = kb.retrieve('vibration standards'); assert len(res) > 0; print('RAG test successful!')"

      - name: Validate LangGraph Orchestrator Execution
        run: |
          python -c "from aegis.orchestration.graph import AegisOrchestrator; orch = AegisOrchestrator(); res = orch.run({'task_id': 'ci-test', 'query': 'Analyse predictive maintenance', 'has_dataset': True, 'require_human_approval': False, 'max_retries': 2, 'retry_count': 0}); assert res['status'] == 'completed'; print('LangGraph Workflow CI test passed!')"

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t aegis-platform:latest -f docker/Dockerfile .
