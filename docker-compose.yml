version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aegis_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AEGIS_PROVIDER=${AEGIS_PROVIDER:-}
      - AEGIS_MODEL=${AEGIS_MODEL:-}
      - AEGIS_JUDGE_MODEL=${AEGIS_JUDGE_MODEL:-}
      - AEGIS_TASK_TIMEOUT_S=${AEGIS_TASK_TIMEOUT_S:-300.0}
      - AEGIS_MAX_CONCURRENT_TASKS=${AEGIS_MAX_CONCURRENT_TASKS:-5}
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aegis_worker
    restart: unless-stopped
    command: python -m aegis.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AEGIS_PROVIDER=${AEGIS_PROVIDER:-}
      - AEGIS_MODEL=${AEGIS_MODEL:-}
      - AEGIS_JUDGE_MODEL=${AEGIS_JUDGE_MODEL:-}
      - AEGIS_TASK_TIMEOUT_S=${AEGIS_TASK_TIMEOUT_S:-300.0}
      - AEGIS_MAX_CONCURRENT_TASKS=${AEGIS_MAX_CONCURRENT_TASKS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  redisdata:
